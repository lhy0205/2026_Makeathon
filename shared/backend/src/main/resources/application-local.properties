# Docker 없이 백엔드만 띄울 때 쓰는 프로파일.
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 인메모리라 서버를 내리면 데이터가 사라진다. 시연이나 UI 확인용이다.
# 팀 공용 개발은 docker compose + MySQL(기본 설정)을 쓴다.

spring.datasource.url=jdbc:h2:mem:medilink;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# db/init/01_schema.sql은 MySQL 컨테이너 전용이라 여기선 안 돈다.
# 대신 JPA가 엔티티에서 스키마를 만든다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# http://localhost:8080/h2-console 에서 안을 들여다볼 수 있다
spring.h2.console.enabled=true

# 로컬에서 관리자 페이지를 바로 열어볼 수 있게 계정을 하나 만들어 둔다.
# 인메모리 DB라 서버를 내리면 사라진다.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@medi.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:admin12345}
