spring.application.name=medilink-backend
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:makeathon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:makeathon}
spring.datasource.password=${MYSQL_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${JWT_SECRET:medilink-local-development-secret-key-change-me}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
ai.provider=${AI_PROVIDER:mock}
ai.fastapi.base-url=${AI_FASTAPI_BASE_URL:http://localhost:8000}
expo.push-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
# 8081/19006 = Expo 개발 서버, 5173 = 관리자 웹(Vite) 개발 서버.
# 배포할 때는 CORS_ALLOWED_ORIGINS로 실제 도메인만 남긴다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:5173}
storage.prescriptions-directory=${PRESCRIPTION_STORAGE_DIR:uploads/prescriptions}
dose.missed-grace-minutes=${DOSE_MISSED_GRACE_MINUTES:60}
dur.enabled=${DUR_ENABLED:false}
dur.base-url=${DUR_BASE_URL:https://apis.data.go.kr/1471000/DURIrdntInfoService03}
dur.path=${DUR_PATH:/getUsjntTabooInfoList02}
dur.service-key=${DUR_SERVICE_KEY:}

# 관리자 계정 부트스트랩. 비워두면 아무 일도 하지 않는다.
# 운영 환경에 기본 관리자가 딸려 들어가지 않도록 반드시 환경변수로 준다.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
# 값은 비워 둔다 — .properties는 ISO-8859-1로 읽혀 한글이 깨진다.
# 비어 있으면 AdminAccountBootstrap이 기본 닉네임을 넣는다.
admin.bootstrap.nickname=${ADMIN_BOOTSTRAP_NICKNAME:}
